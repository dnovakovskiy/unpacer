<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="920" height="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="920" height="280" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- LEFT CARD: MODE 1 -->
  <g transform="translate(24, 24)">
    <rect width="424" height="232" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
    <rect x="20" y="18" width="185" height="28" rx="14" fill="#10b981"/>
    <text x="112" y="37" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">1. NO COACH RIGHT NOW</text>

    <text x="20" y="74" fill="#064e3b" font-size="22" font-weight="800">Full AI Coach &amp; Pacer</text>
    <text x="20" y="98" fill="#047857" font-size="14" font-weight="600">"Build my plan and pace my runs &amp; races."</text>

    <!-- 3 Big Visual Pills -->
    <g transform="translate(20, 114)">
      <rect x="0" y="0" width="112" height="62" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
      <text x="56" y="26" text-anchor="middle" font-size="18">📊</text>
      <text x="56" y="48" text-anchor="middle" fill="#065f46" font-size="13" font-weight="700">Your History</text>

      <text x="125" y="36" text-anchor="middle" fill="#10b981" font-size="20" font-weight="900">→</text>

      <rect x="138" y="0" width="112" height="62" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
      <text x="194" y="26" text-anchor="middle" font-size="18">🗓️</text>
      <text x="194" y="48" text-anchor="middle" fill="#065f46" font-size="13" font-weight="700">Plans Weeks</text>

      <text x="263" y="36" text-anchor="middle" fill="#10b981" font-size="20" font-weight="900">→</text>

      <rect x="276" y="0" width="108" height="62" rx="12" fill="#10b981"/>
      <text x="330" y="26" text-anchor="middle" font-size="18">⌚</text>
      <text x="330" y="48" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">Paces Wrist</text>
    </g>

    <text x="20" y="206" fill="#065f46" font-size="13" font-weight="600">Plans your season &amp; sets every pace target on your watch.</text>
  </g>

  <!-- RIGHT CARD: MODE 2 -->
  <g transform="translate(472, 24)">
    <rect width="424" height="232" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
    <rect x="20" y="18" width="195" height="28" rx="14" fill="#2563eb"/>
    <text x="117" y="37" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">2. BRING YOUR OWN COACH</text>

    <text x="20" y="74" fill="#1e3a8a" font-size="22" font-weight="800">Human-Coach Co-Pilot</text>
    <text x="20" y="98" fill="#1d4ed8" font-size="14" font-weight="600">"My coach writes the plan. Unpacer paces my watch."</text>

    <!-- 3 Big Visual Pills -->
    <g transform="translate(20, 114)">
      <rect x="0" y="0" width="112" height="62" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
      <text x="56" y="26" text-anchor="middle" font-size="18">💬</text>
      <text x="56" y="48" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="700">Coach Note</text>

      <text x="125" y="36" text-anchor="middle" fill="#2563eb" font-size="20" font-weight="900">→</text>

      <rect x="138" y="0" width="112" height="62" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
      <text x="194" y="26" text-anchor="middle" font-size="18">🎯</text>
      <text x="194" y="48" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="700">Sets Pace</text>

      <text x="263" y="36" text-anchor="middle" fill="#2563eb" font-size="20" font-weight="900">→</text>

      <rect x="276" y="0" width="108" height="62" rx="12" fill="#2563eb"/>
      <text x="330" y="26" text-anchor="middle" font-size="18">⌚</text>
      <text x="330" y="48" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">Paces Wrist</text>
    </g>

    <text x="20" y="206" fill="#1e40af" font-size="13" font-weight="600">Turns Telegram or Final Surge notes into watch pace gauges.</text>
  </g>
</svg>