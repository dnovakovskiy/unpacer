<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 265" width="920" height="265" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="920" height="265" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <text x="28" y="38" fill="#0f172a" font-size="18" font-weight="800">Phone-Free Gym: Leave Your Phone in the Locker</text>
  <text x="625" y="38" fill="#047857" font-size="13" font-weight="700">✓ Zero YouTube Between Sets</text>

  <!-- STEP 1 -->
  <g transform="translate(24, 54)">
    <rect width="204" height="188" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="102" y="24" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="800">1. Watch Shows Move</text>
    <circle cx="102" cy="100" r="60" fill="#0f172a" stroke="#334155" stroke-width="5"/>
    <text x="102" y="64" text-anchor="middle" fill="#fb923c" font-size="10" font-weight="800">3D ANIMATION</text>
    <!-- Simple Calf Raise Icon -->
    <circle cx="82" cy="78" r="5" fill="#cbd5e1"/>
    <line x1="82" y1="84" x2="82" y2="104" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="82" y1="104" x2="108" y2="104" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <rect x="100" y="95" width="12" height="6" rx="1.5" fill="#38bdf8"/>
    <line x1="108" y1="104" x2="110" y2="122" stroke="#94a3b8" stroke-width="3.5"/>
    <ellipse cx="105" cy="113" rx="4" ry="6" fill="#ef4444"/>
    <text x="102" y="138" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">Seated Calf Raise</text>
    <text x="102" y="176" text-anchor="middle" fill="#475569" font-size="12" font-weight="600">Highlights target muscle</text>
  </g>

  <text x="239" y="148" text-anchor="middle" fill="#10b981" font-size="20" font-weight="900">→</text>

  <!-- STEP 2 -->
  <g transform="translate(250, 54)">
    <rect width="204" height="188" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="102" y="24" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="800">2. Do Set &amp; Press LAP</text>
    <circle cx="102" cy="100" r="60" fill="#0f172a" stroke="#334155" stroke-width="5"/>
    <text x="102" y="68" text-anchor="middle" fill="#34d399" font-size="10" font-weight="800">SET 1 OF 4</text>
    <text x="102" y="102" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">12 reps</text>
    <text x="102" y="122" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">@ 28 kg</text>
    <rect x="64" y="130" width="76" height="18" rx="9" fill="#0ea5e9"/>
    <text x="102" y="143" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800">Press LAP</text>
    <text x="102" y="176" text-anchor="middle" fill="#475569" font-size="12" font-weight="600">Shows exact reps &amp; kg</text>
  </g>

  <text x="465" y="148" text-anchor="middle" fill="#10b981" font-size="20" font-weight="900">→</text>

  <!-- STEP 3 -->
  <g transform="translate(476, 54)">
    <rect width="204" height="188" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="102" y="24" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="800">3. Quick 1-Tap Check</text>
    <circle cx="102" cy="100" r="60" fill="#0f172a" stroke="#334155" stroke-width="5"/>
    <text x="102" y="68" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="800">LOG WEIGHT</text>
    <text x="102" y="94" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">12 reps ✓</text>
    <rect x="58" y="104" width="88" height="22" rx="6" fill="#1e293b" stroke="#fbbf24"/>
    <text x="102" y="119" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="800">−  28 kg  +</text>
    <text x="102" y="176" text-anchor="middle" fill="#475569" font-size="12" font-weight="600">Change kg if you went heavier</text>
  </g>

  <text x="691" y="148" text-anchor="middle" fill="#10b981" font-size="20" font-weight="900">→</text>

  <!-- STEP 4 -->
  <g transform="translate(702, 54)">
    <rect width="194" height="188" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="97" y="24" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="800">4. Auto Rest &amp; Buzz</text>
    <circle cx="97" cy="100" r="60" fill="#0f172a" stroke="#38bdf8" stroke-width="5"/>
    <text x="97" y="68" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="800">REST TIMER</text>
    <text x="97" y="104" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="800">0:60</text>
    <text x="97" y="124" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">Next: Set 2 of 4</text>
    <text x="97" y="142" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="700">📳 Buzzes Wrist</text>
    <text x="97" y="176" text-anchor="middle" fill="#475569" font-size="12" font-weight="600">Done in 40 mins flat</text>
  </g>
</svg>